# Example overlay values for token-matched continuation.
# Copy these keys into configs/c1_alignment_160m_pilot.yaml if missing,
# or simply run scripts/plan_c1_continuation_token_budgets.py on your existing config.
continuation:
  corpus_path: data/e3_continuation/fixed_pile_val_seed0.jsonl
  endpoint_step: 8000
  pythia_tokens_per_step: 2097152
  batch_size: 16
  sequence_length: 256
  grad_accum_steps: 1
  lr_schedule: pythia_cosine
  reset_optimizer_after_injection: true
  budget_unit: tokens
