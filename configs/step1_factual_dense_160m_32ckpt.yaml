signal:
  type: factual
  n_items: 300
  n_probe: 200
  n_distractors: 4
  relations:
  - capital
  - currency
  - patron
  - river
  train_templates:
  - The {rel} of {e} is {v}.
  - '{v} is the {rel} of {e}.'
  - '{e}''s {rel} is {v}.'
  probe_template: 'Question: What is the {rel} of {e}?

    Answer:'
injection:
  lr: 1.0e-05
  fixed_lr_across_stages: true
continuation:
  corpus_path: data/e3_continuation/fixed_pile_val_seed0.jsonl
  fixed_budget_across_stages: true
  mode: short_horizon_fixed_budget
attacks:
  poison_budgets:
  - 4
  - 16
  - 64
  - 256
  restart_each_budget_from_post_injection: true
design:
  step: "Step 1 \u2014 dense short-horizon factual durability sweep"
  purpose: artifact-protected behavioural foundation
  checkpoint_count: 32
  early_dense_count: 20
  late_sparse_count: 12
  controls:
  - fixed injection LR across stages
  - fixed short continuation budget across stages
  - uptake-covariate analysis
  - segmented-vs-monotone comparison
model_name: EleutherAI/pythia-160m-deduped
training:
  dtype: float32
  max_len: 128
  batch_size: 16
  injection_steps: 600
  injection_lr: 2.0e-05
  weight_decay: 0.0
  grad_clip_norm: 1.0
  shuffle_each_epoch: true
retention:
  enabled: true
  corpus_path: data/e3_continuation/fixed_pile_val_seed0.jsonl
  continuation_jsonl: data/e3_continuation/fixed_pile_val_seed0.jsonl
  continuation_corpus: fixed_jsonl
  continuation_steps: 500
  continuation_batch_size: 16
  continuation_lr: 2.0e-05
degradation:
  enabled: true
  poison_budgets:
  - 4
  - 16
  - 64
  - 256
  poison_budget_unit: facts
  poison_lr: 2.0e-05
  poison_batch_size: 16
  poison_epochs: 1
  threshold_accuracy: 0.5
