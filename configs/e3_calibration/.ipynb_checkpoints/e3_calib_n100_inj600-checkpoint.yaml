experiment_id: e3_factual_160m_smoke
thesis_section: Chapter 4, E3 critical-period intervention
model: EleutherAI/pythia-160m-deduped
stages:
- step1000
seeds:
- 0
- 1
- 2
runtime:
  device: auto
  dtype: float32
  trust_remote_code: false
  max_length: 128
  local_files_only: false
signal:
  type: factual_association
  train_facts: 120
  eval_facts: 80
  train_templates_per_fact: 2
  eval_templates_per_fact: 2
  num_distractors: 4
  require_single_token_values: true
  value_candidate_count: 2000
  entity_prefix: zorlan
  n_items: 100
  n_probe: 200
training:
  injection_steps: 600
  injection_lr: 2.0e-05
  batch_size: 8
  grad_accum_steps: 1
  weight_decay: 0.0
  max_grad_norm: 1.0
  log_every: 20
continuation:
  enabled: true
  steps: 40
  lr: 1.0e-05
  batch_size: 8
  texts:
  - Language models are trained by predicting text. A fixed continuation corpus is
    used here as a control after signal injection.
  - Scientific experiments separate observation from intervention. A short continuation
    budget tests whether an injected signal is retained.
  - The model reads ordinary text that does not mention the fictional entities used
    in the signal dataset.
  - Training dynamics can contain rapid early changes followed by slower consolidation.
degradation:
  enabled: true
  budgets:
  - 4
  - 16
  lr: 2.0e-05
  batch_size: 8
  epochs: 1
  mode: conflicting_values
analysis:
  uptake_margin_threshold: 0.25
  uptake_accuracy_threshold: 0.2
  retention_boundary_step: 2000
  degradation_accuracy_threshold: 0.5
outputs:
  root: results/e3_signal_calibration/n100_inj600
  metrics_csv: raw/e3_factual_metrics.csv
  item_metrics_csv: raw/e3_factual_item_metrics.csv
  manifest_csv: manifests/artifact_manifest.csv
