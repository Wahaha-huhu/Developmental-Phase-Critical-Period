experiment_id: e3_factual_410m_final_reduced_v4
model_name: EleutherAI/pythia-410m-deduped
stages: [step512, step1000, step2000, step8000, step143000]
seeds: [0, 1, 2]
outputs:
  root: results/e3_critical_period_intervention_410m_final_reduced_v4
signal:
  type: factual
  n_items: 300
  n_probe: 200
  n_distractors: 4
  relations: [capital, currency, patron, river]
  train_templates:
    - "The {rel} of {e} is {v}."
    - "{v} is the {rel} of {e}."
    - "{e}'s {rel} is {v}."
  probe_template: "Question: What is the {rel} of {e}?\nAnswer:"
tokenizer:
  max_name_pieces: 3
  add_leading_space_for_values: true
training:
  dtype: float32
  max_len: 128
  batch_size: 8
  injection_steps: 600
  injection_lr: 2.0e-5
  weight_decay: 0.0
  grad_clip_norm: 1.0
  shuffle_each_epoch: true
retention:
  enabled: true
  continuation_corpus: fixed_jsonl
  continuation_jsonl: data/e3_continuation/fixed_continuation_seed0.jsonl
  continuation_steps: 500
  continuation_batch_size: 8
  continuation_lr: 2.0e-5
degradation:
  enabled: true
  poison_budgets: [4, 16, 64, 256]
  poison_budget_unit: facts
  poison_lr: 2.0e-5
  poison_batch_size: 8
  poison_epochs: 1
  threshold_accuracy: 0.5
sanity_checks:
  require_probe_subset_of_train: true
  require_control_disjoint_from_train: true
  require_positive_uptake_for_interpretability: true
  min_uptake_margin_delta: 0.25
