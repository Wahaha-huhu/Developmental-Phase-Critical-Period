# E1 reduced replication config: Pythia-410M.
# Use this reduced early grid first to control download and SVD time.
experiment_id: e1_phase_identification
models:
  - EleutherAI/pythia-410m-deduped
checkpoints:
  - step0
  - step128
  - step512
  - step1000
  - step2000
  - step3000
  - step8000
modules:
  - attention.query_key_value
  - attention.dense
  - mlp.dense_h_to_4h
  - mlp.dense_4h_to_h
metrics:
  frobenius_norm: true
  spectral_norm: true
  stable_rank: true
  effective_rank: true
  mp_outliers: true
  alpha: true
  subspace_stability: true
svd:
  device: cuda
  dtype: float32
  top_k: 8
  effective_rank_eps: 1.0e-12
mp_outliers:
  thresholds: [1.0, 1.1, 1.25]
alpha:
  tail_fractions: [0.2, 0.3, 0.5]
output:
  raw_csv: results/e1_phase_identification/raw/e1_spectral_metrics.csv
  manifest_csv: results/e1_phase_identification/manifests/artifact_manifest.csv
runtime:
  resume: true
  flush_every_checkpoint: true
  trust_remote_code: false
outputs:
  root: results/e1_phase_identification
